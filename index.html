<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' ws: wss: http: https:; media-src 'self' blob:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>المجلس · Majlis</title>
<meta name="description" content="خمس ألعاب لوحية على جهاز واحد: إكس أو، لودو، الذاكرة، خطوط ومربّعات، ماهجونج. تعمل دون إنترنت. Five board games on one device, fully offline.">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#12100E">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="المجلس">
<link rel="icon" href="./icons/favicon-64.png" type="image/png">
<link rel="icon" sizes="192x192" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#100E0C; --ink2:#1A1714; --ink3:#241F1A; --line:rgba(237,228,211,.10);
  --felt:#1B3A32; --felt2:#265144;
  --bone:#EFE7D8; --bone2:#DCCFB8; --bone3:#B9AB92;
  --brass:#CFA24A; --brass2:#8A6A26;
  --clay:#AC4529; --indigo:#375480; --muted:#8C8375;
  --ok:#4FA88A;
  --pad:18px; --r:14px;
  --tileA:#F7CB5A; --tileB:#E5A21C; --tileC:#C8830A; --tileEdge:#96620A; --tileFace:#FBF7EE;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overscroll-behavior:none}
body{
  background:var(--ink);color:var(--bone);
  font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;
  overflow-x:hidden;overflow-y:auto;-webkit-user-select:none;user-select:none;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(120% 60% at 50% -10%, rgba(207,162,74,.13), transparent 60%),
    radial-gradient(90% 50% at 50% 110%, rgba(27,58,50,.35), transparent 60%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><g fill='none' stroke='%23CFA24A' stroke-width='1' opacity='.07'><path d='M32 9 L40 24 L55 32 L40 40 L32 55 L24 40 L9 32 L24 24 Z'/></g></svg>");
  background-size:auto,auto,64px 64px;
}
#fx{position:fixed;inset:0;z-index:99;pointer-events:none}
body.playing:has(#mj.on) .app{max-width:560px;padding-inline:8px}
#mj .gbar{margin-top:8px}
body.playing{overflow:hidden}
body.playing .app{height:100dvh;min-height:0}
body.playing .gwrap{overflow:hidden}
.app{position:relative;z-index:1;max-width:500px;margin:0 auto;padding:0 var(--pad) 14px;
  min-height:100dvh;display:flex;flex-direction:column}
.app.shake{animation:shk .34s}
@keyframes shk{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
h1,h2,h3{font-weight:700}

/* ===== شريط علوي ===== */
.bar{display:flex;align-items:center;gap:9px;margin:14px 0 0;padding:9px 10px;
  background:linear-gradient(180deg,var(--ink3),var(--ink2));
  border:1px solid rgba(207,162,74,.26);border-radius:16px}
.avatar{width:42px;height:42px;border-radius:12px;flex:none;position:relative;
  background:linear-gradient(155deg,var(--bone),var(--bone2));color:var(--ink);
  display:grid;place-items:center;font-family:"Aref Ruqaa",serif;font-size:21px;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.avatar::after{content:"";position:absolute;inset-inline-end:-3px;bottom:-3px;width:12px;height:12px;
  border-radius:50%;background:var(--ok);border:2px solid var(--ink2)}
.avatar[data-st=busy]::after{background:var(--clay)}
.avatar[data-st=away]::after{background:var(--muted)}
.who{flex:1;min-width:0;line-height:1.3}
.who b{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who span{display:block;font-size:12px;color:var(--muted)}
.mini{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:transparent;border:1px solid var(--line);color:var(--bone2);cursor:pointer;
  font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;transition:.15s}
.mini:hover{border-color:var(--brass);color:var(--brass)}
.mini.off{opacity:.4}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* ===== ترويسة ===== */
.hero{padding:clamp(8px,2.2vh,22px) 2px 4px;flex:none;text-align:center}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.22em;color:var(--brass)}
.hero h1{margin:clamp(5px,1.1vh,10px) 0 clamp(4px,1vh,8px);line-height:.95;font-size:clamp(30px,6.4vh,52px)}
.hero h1 .ar{font-family:"Aref Ruqaa",serif}
.hero h1 .en{font-family:"Fraunces",serif;letter-spacing:-.02em}
.hero p{margin:0 auto;color:var(--muted);font-size:clamp(12.5px,1.7vh,14.5px);max-width:34ch;line-height:1.55}

.strip{display:flex;align-items:center;gap:10px;margin:clamp(10px,2vh,18px) 0 0;padding:clamp(9px,1.5vh,12px) 13px;flex:none;border-radius:13px;
  background:rgba(207,162,74,.07);border:1px solid rgba(207,162,74,.26);font-size:13px;color:var(--bone2)}
.strip button{margin-inline-start:auto;background:var(--brass);border:none;color:var(--ink);
  border-radius:9px;padding:7px 14px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}
.strip button:active{transform:scale(.96)}

/* ===== بطاقات الألعاب ===== */
.games{display:grid;grid-template-columns:1fr 1fr;gap:clamp(9px,1.6vh,12px);
  margin:clamp(12px,2.2vh,22px) auto 0;flex:1;min-height:0;width:100%;align-content:center}
.games .wide{grid-column:1 / -1;flex-direction:row;align-items:center;justify-content:center;gap:14px;min-height:72px;text-align:start}
.games .wide .txt{display:flex;flex-direction:column}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  min-height:88px;gap:clamp(6px,1.2vh,10px);width:100%;text-align:start;
  padding:clamp(10px,1.8vh,14px);border-radius:18px;cursor:pointer;color:inherit;font-family:inherit;
  background:linear-gradient(180deg,var(--ink3),var(--ink2));border:1px solid var(--line);
  transition:transform .18s,border-color .18s;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;opacity:0;transition:opacity .2s;
  background:radial-gradient(120% 80% at 50% 0%,rgba(207,162,74,.16),transparent 70%)}
.card:hover::before{opacity:1}
.card:hover{transform:translateY(-2px);border-color:rgba(207,162,74,.5)}
.card:active{transform:scale(.985)}
.thumb{width:clamp(54px,9.2vh,80px);height:clamp(54px,9.2vh,80px);flex:none;border-radius:14px;overflow:hidden;background:var(--bone);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.card h3{margin:0;font-size:clamp(14.5px,2vh,16.5px);font-weight:600;position:relative;z-index:1}
.card .meta{font-size:10.5px;color:var(--muted);font-family:"IBM Plex Mono",monospace;position:relative;z-index:1;line-height:1.4}
.card .go{display:none}
.t-xo{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:100%;height:100%}
.t-xo div{border:.5px solid rgba(16,14,12,.16);display:grid;place-items:center;font-size:19px;color:var(--ink)}
.t-xo div.b{color:var(--clay)}
.t-lu{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4px;padding:4px;width:100%;height:100%}
.t-lu i{border-radius:6px}
.t-mem{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4px;padding:6px;width:100%;height:100%}
.t-mem i{border-radius:5px;background:var(--felt)}
.t-mem i.up{background:var(--bone2)}
.t-db{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:3px;padding:5px;width:100%;height:100%}
.t-db i{border-radius:3px;background:rgba(16,14,12,.12)}
.t-db i.f{background:var(--bc);border-radius:4px}
.t-mj{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:4px;padding:6px;width:100%;height:100%}
.t-mj i{border-radius:3px;background:#1B3A32}
.t-mj i.up{background:var(--bone2)}
.foot{margin-top:clamp(8px,1.6vh,20px);flex:none;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:#4A453D;letter-spacing:.12em}
.foot a{color:#5E574C;text-decoration:none;border-bottom:1px dotted #3A352E}

/* ===== شاشات الألعاب ===== */
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex;animation:enter .26s ease}
.gwrap{flex:1;min-height:0;width:100%;max-width:100%;display:flex;flex-direction:column;justify-content:center;
  align-items:center;gap:clamp(18px,3.6vh,34px);padding:clamp(14px,2.6vh,26px) 5px}
#mj .gwrap{gap:0;padding:clamp(4px,.8vh,9px) 0}
.gwrap>.score,.gwrap>.turnrail,.gwrap>.result{width:100%}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}
.gbar{display:flex;align-items:center;gap:8px;margin:14px 0 0;flex:none}
.gbar .title{flex:1;text-align:center;font-size:21px}
.gbar .title .ar{font-family:"Aref Ruqaa",serif}
.gbar .title .en{font-family:"Fraunces",serif}
.icon{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:var(--ink3);border:1px solid var(--line);color:var(--bone2);cursor:pointer;font-size:16px}
.icon:hover{border-color:var(--brass);color:var(--brass)}
html[dir=ltr] .icon.back{transform:scaleX(-1)}

.score{display:flex;gap:7px;margin:0;padding:3px 1px}
.tile{flex:1;min-width:0;background:linear-gradient(180deg,var(--bone),var(--bone2));color:var(--ink);
  border-radius:13px;padding:9px 4px;text-align:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.14);transition:transform .2s}
.tile b{display:block;font-family:"IBM Plex Mono",monospace;font-size:21px;line-height:1.1}
.tile span{font-size:11px;color:#5F594E;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.live{outline:2px solid var(--brass);outline-offset:1px}
.tile.bump{animation:bump .34s}
@keyframes bump{40%{transform:translateY(-7px) scale(1.06)}}

.turnrail{position:relative;height:clamp(30px,4.4vh,36px);margin:0;border-radius:11px;background:var(--ink2);
  border:1px solid var(--line);overflow:hidden}
.turnrail .slider{position:absolute;top:3px;bottom:3px;width:calc(50% - 4px);inset-inline-start:3px;
  background:linear-gradient(180deg,var(--brass),var(--brass2));border-radius:8px;
  transition:transform .3s cubic-bezier(.4,1.4,.5,1)}
.turnrail.p2 .slider{transform:translateX(calc(-100% - 2px))}
html[dir=ltr] .turnrail.p2 .slider{transform:translateX(calc(100% + 2px))}
.turnrail .labels{position:absolute;inset:0;display:flex;align-items:center}
.turnrail .labels span{flex:1;text-align:center;font-size:13px;font-weight:600;color:var(--muted);z-index:1}
.turnrail .labels span.act{color:var(--ink)}

/* ===== إكس أو ===== */
.xo{margin:0 auto;width:min(100%,360px,max(220px,50vh));aspect-ratio:1;position:relative;padding:10px;
  border-radius:20px;background:linear-gradient(180deg,var(--bone),var(--bone2));
  box-shadow:0 16px 34px rgba(0,0,0,.5),inset 0 -4px 0 rgba(0,0,0,.13);
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.xo button{background:none;border:none;padding:0;cursor:pointer;position:relative;display:grid;place-items:center;
  font-size:min(13vw,52px);color:var(--ink);font-family:"IBM Plex Sans Arabic",sans-serif}
.xo button::after{content:"";position:absolute;inset:6px;border-radius:12px;background:rgba(16,14,12,.06);opacity:0;transition:.15s}
.xo button:hover:not(:disabled)::after{opacity:1}
.xo .ln{position:absolute;background:rgba(16,14,12,.13);border-radius:2px}
.xo .ln.v{width:2px;top:8%;bottom:8%}
.xo .ln.h{height:2px;left:8%;right:8%}
.glyph{display:block;animation:pop .24s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{from{transform:scale(.3) rotate(-22deg);opacity:0}}
.winline{position:absolute;height:6px;border-radius:4px;background:var(--brass);
  box-shadow:0 2px 16px rgba(207,162,74,.8);animation:grow .35s ease}
@keyframes grow{from{width:0!important}}
.result{margin:0;text-align:center;min-height:22px;font-size:14px;color:var(--bone2)}
#mjres{display:none}
.result b{color:var(--brass);font-size:19px}

/* ===== الذاكرة ===== */
.mem{margin:0 auto;width:min(100%,360px,max(220px,48vh));display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(7px,1.3vh,10px)}
.mcard{aspect-ratio:1;perspective:760px;background:none;border:none;padding:0;cursor:pointer}
.mface{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.4,1.2,.5,1)}
.mcard.flip .mface{transform:rotateY(180deg)}
.mface>div{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;display:grid;place-items:center}
.mback{background:linear-gradient(155deg,var(--felt2),var(--felt));box-shadow:inset 0 0 0 1px rgba(207,162,74,.32)}
.mback svg{width:50%;height:50%;opacity:.7}
.mfront{background:linear-gradient(180deg,var(--bone),var(--bone2));transform:rotateY(180deg);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.13)}
.mfront svg{width:56%;height:56%}
.mcard.done .mfront{background:linear-gradient(180deg,var(--brass),var(--brass2))}
.mcard.done{animation:settle .4s}
@keyframes settle{45%{transform:scale(1.12)}}
.mcard.miss{animation:nope .4s}
@keyframes nope{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ===== لودو ===== */
.ludo-wrap{margin:0 auto;width:min(100%,620px,max(240px,calc(100dvh - 172px)));max-width:100%}
.lrail{display:flex;gap:6px;max-width:100%;margin:0 0 clamp(9px,1.8vh,16px)}
.lp{flex:1;min-width:0;border-radius:12px;padding:6px 3px;text-align:center;background:var(--ink2);
  border:1px solid var(--line);transition:.22s}
.lp .swatch{height:4px;border-radius:3px;margin-bottom:5px;opacity:.4}
.lp.act{transform:translateY(-3px);border-color:rgba(207,162,74,.4)}
.lp.act .swatch{opacity:1;height:6px;margin-bottom:3px}
.lp .nm{font-size:11.5px;font-weight:600;color:var(--muted)}
.lp.act .nm{color:var(--bone)}
.lp .fin{font-family:"IBM Plex Mono",monospace;font-size:14px;color:var(--bone2)}
.lp .who2{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:#5E574C}
.board{position:relative;width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(15,1fr);
  grid-template-rows:repeat(15,1fr);background:var(--ink2);border-radius:18px;overflow:hidden;
  box-shadow:0 16px 36px rgba(0,0,0,.55)}
.cell{border:.5px solid rgba(16,14,12,.10)}
.path{background:var(--bone)}
.safe{position:relative}
.safe::after{content:"";position:absolute;inset:24%;background:rgba(16,14,12,.20);
  clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
.center{background:var(--ink3)}
.yardpad{position:absolute;border-radius:12px;background:rgba(239,231,216,.92);z-index:1}
.yardlink{position:absolute;z-index:2;border:2px dashed;border-radius:26%;opacity:.42}
.center-home{border-radius:5px;box-shadow:inset 0 0 0 1.5px rgba(16,14,12,.35)}
.tok{position:absolute;z-index:4;border:none;background:none;padding:0;cursor:default;
  transition:inset-inline-start .2s ease,top .2s ease;filter:drop-shadow(0 3px 4px rgba(0,0,0,.55))}
.tok svg{width:100%;height:100%;display:block}
.tok.can{cursor:pointer;animation:breathe 1.05s infinite;z-index:7}
@keyframes breathe{50%{filter:drop-shadow(0 0 7px rgba(207,162,74,.95)) drop-shadow(0 3px 4px rgba(0,0,0,.5));transform:translateY(-3px)}}
.tok.hop{animation:hop .16s}
@keyframes hop{50%{transform:translateY(-9px) scale(1.12)}}
.tok.dead{animation:dead .42s}
@keyframes dead{50%{transform:scale(1.5) rotate(22deg);opacity:.35}}
.die3d{position:absolute;z-index:9;width:10%;height:10%;padding:0;border:none;background:none;
  cursor:pointer;perspective:640px;transition:top .45s cubic-bezier(.4,1.1,.4,1),inset-inline-start .45s cubic-bezier(.4,1.1,.4,1)}
.die3d[disabled]{cursor:default;opacity:.72}
.cube{position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform .58s cubic-bezier(.2,.9,.25,1)}
.die3d.press{animation:diepress .26s ease}
@keyframes diepress{40%{transform:scale(.86)}100%{transform:scale(1)}}
.face{position:absolute;inset:0;border-radius:var(--br,14px);overflow:hidden;backface-visibility:hidden;display:grid;padding:14%;gap:7%;
  grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  background:linear-gradient(150deg,rgba(255,255,255,.42),rgba(255,255,255,.02) 62%),var(--dc,#EFE7D8);
  box-shadow:inset 0 -7% 0 rgba(0,0,0,.16),0 4px 9px rgba(0,0,0,.5)}
.f1{transform:translateZ(var(--z))}
.f6{transform:rotateY(180deg) translateZ(var(--z))}
.f3{transform:rotateY(90deg) translateZ(var(--z))}
.f4{transform:rotateY(-90deg) translateZ(var(--z))}
.f2{transform:rotateX(90deg) translateZ(var(--z))}
.f5{transform:rotateX(-90deg) translateZ(var(--z))}
.pip{border-radius:50%;background:#100E0C;opacity:0;box-shadow:inset 0 1px 1px rgba(255,255,255,.35)}
.pip.on{opacity:1}
.die3d.dark .pip{background:#fff;box-shadow:inset 0 -1px 1px rgba(0,0,0,.35)}

/* ===== نوافذ ===== */
.overlay{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center;
  background:rgba(6,5,4,.74);backdrop-filter:blur(3px)}
.overlay.on{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:500px;max-height:92vh;overflow-y:auto;background:var(--ink2);
  border:1px solid rgba(207,162,74,.28);border-bottom:none;border-radius:22px 22px 0 0;
  padding:8px 18px calc(26px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.3,1.2,.5,1)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:44px;height:4px;border-radius:3px;background:rgba(239,231,216,.22);margin:6px auto 14px}
.sheet h2{font-size:23px;margin:0 0 5px}
.sheet h2 .ar{font-family:"Aref Ruqaa",serif}
.sheet h2 .en{font-family:"Fraunces",serif}
.sheet .sub{color:var(--muted);font-size:13px;margin:0 0 16px;line-height:1.6}
.fl{display:block;font-size:12px;color:var(--muted);margin:16px 0 7px;letter-spacing:.04em}
.fl:first-of-type{margin-top:0}
input.txt{width:100%;background:var(--ink3);border:1px solid rgba(239,231,216,.16);color:var(--bone);
  border-radius:12px;padding:12px 13px;font-family:inherit;font-size:15px}
input.txt:focus{outline:none;border-color:var(--brass)}
.opts{display:flex;gap:8px}
.opt{flex:1;padding:12px 6px;border-radius:13px;background:var(--ink3);border:1px solid var(--line);
  color:var(--bone2);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:.15s;text-align:center}
.opt:hover{border-color:rgba(207,162,74,.45)}
.opt.sel{border-color:var(--brass);color:var(--brass);background:rgba(207,162,74,.10)}
.opt small{display:block;font-size:10.5px;color:var(--muted);margin-top:4px;font-weight:400}
.opt.sel small{color:rgba(207,162,74,.7)}
.opt i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-inline-end:6px;vertical-align:-1px}
.opt .pair{font-size:20px;letter-spacing:.14em;display:block}
.colors{display:flex;gap:9px}
.col{flex:1;aspect-ratio:1.45;border-radius:13px;border:2px solid transparent;cursor:pointer;position:relative;padding:0;transition:.16s}
.col.sel{border-color:var(--bone);transform:translateY(-4px);box-shadow:0 8px 16px rgba(0,0,0,.45)}
.col b{position:absolute;inset-inline-start:7px;bottom:5px;font-size:11px;color:rgba(255,255,255,.95);
  font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.col.off{opacity:.32;filter:grayscale(.5)}
.col.sel::after{content:"✓";position:absolute;inset-inline-end:6px;top:2px;color:#fff;font-size:13px}
.note{color:var(--muted);font-size:12.5px;margin:14px 0 0;line-height:1.7}
.note b{color:var(--bone2);font-weight:500}
.primary{width:100%;margin-top:20px;background:linear-gradient(180deg,var(--brass),var(--brass2));
  border:none;color:var(--ink);font-family:inherit;font-weight:700;font-size:15px;padding:14px;border-radius:13px;cursor:pointer}
.primary:active{transform:scale(.985)}
.secondary{width:100%;margin-top:9px;background:transparent;border:1px solid var(--line);color:var(--bone2);
  font-family:inherit;font-size:14.5px;padding:13px;border-radius:13px;cursor:pointer}
.empty{text-align:center;padding:26px 10px 8px;color:var(--muted)}
.empty .mark{width:64px;height:64px;margin:0 auto 14px;border-radius:18px;background:var(--ink3);
  display:grid;place-items:center;border:1px solid var(--line)}
.empty b{display:block;color:var(--bone);font-size:15.5px;margin-bottom:7px;font-weight:600}
.empty p{margin:0;font-size:13px;line-height:1.7}

.banner{position:fixed;inset:0;z-index:110;display:none;place-items:center;background:rgba(6,5,4,.62);backdrop-filter:blur(2px)}
.banner.on{display:grid;animation:fade .25s}
.banner .in{text-align:center;padding:20px;animation:zoom .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes zoom{from{transform:scale(.5);opacity:0}}
.banner h2{font-size:42px;margin:0 0 6px;color:var(--brass);text-shadow:0 4px 26px rgba(207,162,74,.5)}
.banner h2 .ar{font-family:"Aref Ruqaa",serif}.banner h2 .en{font-family:"Fraunces",serif}
.banner p{color:var(--bone2);margin:0 0 20px}
.banner .primary{width:auto;padding:12px 30px}
.toast{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom));left:50%;z-index:120;
  transform:translateX(-50%) translateY(20px);background:var(--bone);color:var(--ink);padding:11px 18px;
  border-radius:13px;font-size:13.5px;font-weight:500;opacity:0;transition:.25s;pointer-events:none;
  box-shadow:0 10px 26px rgba(0,0,0,.55);max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* ===== خطوط ومربعات ===== */
.dbwrap{margin:0 auto;width:min(100%,400px,max(230px,52vh));position:relative;aspect-ratio:1;
  background:linear-gradient(180deg,var(--bone),var(--bone2));border-radius:20px;
  box-shadow:0 16px 34px rgba(0,0,0,.5),inset 0 -4px 0 rgba(0,0,0,.13);padding:8%}
.dbin{position:relative;width:100%;height:100%}
.dbdot{position:absolute;width:3.6%;height:3.6%;border-radius:50%;background:rgba(16,14,12,.55);
  transform:translate(50%,-50%);z-index:3;pointer-events:none}
html[dir=ltr] .dbdot{transform:translate(-50%,-50%)}
.dbln{position:absolute;border:none;padding:0;background:rgba(16,14,12,.10);border-radius:99px;
  cursor:pointer;z-index:2;transition:background .18s,transform .18s}
.dbln.h{height:3.4%;transform:translateY(-50%)}
.dbln.v{width:3.4%;transform:translateX(50%)}
html[dir=ltr] .dbln.v{transform:translateX(-50%)}
.dbln:not(.on):hover{background:rgba(16,14,12,.26)}
.dbln.on{cursor:default;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.dbln.pop{animation:lnpop .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes lnpop{40%{filter:brightness(1.5)}}
.dbbox{position:absolute;display:grid;place-items:center;border-radius:14%;opacity:0;
  transform:scale(.4);transition:opacity .3s,transform .35s cubic-bezier(.3,1.6,.5,1);z-index:1}
.dbbox.on{opacity:.92;transform:scale(1)}
.dbbox span{font-family:"Aref Ruqaa",serif;font-size:min(4.4vh,26px);color:rgba(255,255,255,.92);
  text-shadow:0 1px 4px rgba(0,0,0,.4)}
html[dir=ltr] .dbbox span{font-family:"Fraunces",serif}
.dbrail{display:flex;gap:6px;width:100%;max-width:100%}
/* ===== ماهجونج ===== */
.mjwrap{width:100%;max-width:none;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;
  justify-content:space-evenly;gap:clamp(2px,.6vh,7px);--mjw:44px;perspective:1400px}
.mjside{display:flex;justify-content:space-between;align-items:flex-start;gap:0;width:100%;
  overflow:clip;overflow-clip-margin:12px}
.mjside.foe{transform:rotateX(11deg);transform-origin:center bottom}
.mjside.me{transform:rotateX(-9deg);transform-origin:center top}
.mjframe{position:relative;width:100%;border-radius:20px;padding:clamp(8px,2vw,13px);align-self:center;
  display:flex;flex-direction:column;gap:clamp(5px,1.1vh,9px);
  border:2px solid var(--pc,#888);
  background:
    linear-gradient(180deg,color-mix(in srgb,var(--pc) 20%,transparent),color-mix(in srgb,var(--pc) 6%,transparent)),
    repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 6px,transparent 6px 13px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.10),inset 0 0 26px color-mix(in srgb,var(--pc) 22%,transparent),
    0 8px 22px rgba(0,0,0,.5);
  transition:box-shadow .3s,transform .3s}
.mjframe::before{content:"";position:absolute;inset:4px;border-radius:15px;pointer-events:none;
  border:1px dashed color-mix(in srgb,var(--pc) 45%,transparent);opacity:.65}
.mjframe .orn{position:absolute;width:14px;height:14px;background:var(--pc);opacity:.9;
  clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
.mjframe .orn.a{top:-8px;inset-inline-start:16px}
.mjframe .orn.b{top:-8px;inset-inline-end:16px}
.mjframe .orn.c{bottom:-8px;inset-inline-start:16px}
.mjframe .orn.d{bottom:-8px;inset-inline-end:16px}
.mjframe .edge{position:absolute;background:var(--pc);opacity:.55;border-radius:2px}
.mjframe .edge.t{height:2px;left:34px;right:34px;top:-2px}
.mjframe .edge.b{height:2px;left:34px;right:34px;bottom:-2px}
.mjframe.turn{box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),
  inset 0 0 32px color-mix(in srgb,var(--pc) 34%,transparent),
  0 0 0 3px color-mix(in srgb,var(--pc) 65%,transparent),0 10px 26px rgba(0,0,0,.55)}
.mjframe.turn .orn{animation:ornspin 3.4s linear infinite}
@keyframes ornspin{to{transform:rotate(360deg)}}
.mjlbl{align-self:flex-end;display:flex;align-items:center;gap:6px;
  background:rgba(0,0,0,.42);padding:2px 11px;border-radius:20px;font-size:11.5px;color:var(--bone2);
  border:1px solid color-mix(in srgb,var(--pc) 60%,transparent);white-space:nowrap}
.mjlbl b{font-family:"IBM Plex Mono",monospace;color:var(--pc);font-weight:600}
.mjlbl i{width:6px;height:6px;border-radius:50%;background:var(--pc);display:none}
.mjframe.turn .mjlbl i{display:block;animation:mjdot 1.1s ease-in-out infinite}
@keyframes mjdot{50%{opacity:.25}}
.mjframe.foeframe{flex-direction:column-reverse}
.mjboards{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.4vh,12px);width:100%}
.mjframe .mjside{width:100%}
.mjcol{background:none;border:none;padding:0;border-radius:10px;cursor:default;display:flex;
  flex-direction:column;gap:clamp(2px,.5vw,4px);transform-style:preserve-3d;position:relative;
  transition:background .25s}
.mjcol.full{background:rgba(207,162,74,.16);box-shadow:0 0 0 2px var(--brass) inset}
.mjcol.full .mjt{box-shadow:0 2px 0 #C9BEA6,0 4px 7px rgba(0,0,0,.42)}
.mjcol.rev{flex-direction:column-reverse}
.mjt{width:var(--mjw);height:var(--mjh);border-radius:var(--tr,10px);overflow:hidden;position:relative;isolation:isolate;
  background:var(--tileFace);box-shadow:0 2px 0 #C9BEA6,0 4px 7px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.9)}
.mjt svg{width:100%;height:100%;display:block}
.mjt.back{background:linear-gradient(158deg,var(--tileA),var(--tileB) 52%,var(--tileC));
  box-shadow:0 2px 0 var(--tileEdge),0 4px 7px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.45)}
.mjt.back::after{content:"";position:absolute;inset:17%;border-radius:14%;
  border:1.5px solid rgba(120,75,4,.34);box-shadow:inset 0 0 0 2px rgba(255,255,255,.26)}
.mjcol.hit{cursor:pointer}
.mjcol.hit .mjt:first-child,.mjcol.rev.hit .mjt:last-child{
  outline:3px solid var(--brass);outline-offset:2px;animation:mjbob .85s ease-in-out infinite}
@keyframes mjbob{50%{transform:translateY(-7px) scale(1.04)}}

.mjt.slide{animation:mjslide .45s cubic-bezier(.25,1.3,.4,1)}
@keyframes mjslide{from{transform:translateY(-140%) rotateX(70deg);opacity:0}}
.mjt.slideup{animation:mjslideup .45s cubic-bezier(.25,1.3,.4,1)}
@keyframes mjslideup{from{transform:translateY(140%) rotateX(-70deg);opacity:0}}

.mjstage{display:flex;align-items:center;justify-content:center;gap:clamp(16px,6vw,34px);width:100%;
  padding:clamp(2px,.8vh,7px) 0;perspective:900px}
.mjpile{display:flex;flex-direction:column;align-items:center;gap:4px}
.mjpile .cnt{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
.mjdeck{width:calc(var(--mjw) * .92);height:calc(var(--mjh) * .92);border-radius:var(--tr,10px);border:none;padding:0;cursor:pointer;
  position:relative;background:linear-gradient(158deg,var(--tileA),var(--tileB) 52%,var(--tileC));
  box-shadow:0 4px 0 var(--tileEdge),0 7px 12px rgba(0,0,0,.55)}
.mjdeck::after{content:"";position:absolute;inset:15%;border-radius:12%;
  border:1.5px solid rgba(0,0,0,.18);box-shadow:inset 0 0 0 2px rgba(255,255,255,.22)}
.mjdeck:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tileEdge)}
.mjdeck[disabled]{opacity:.4;cursor:default}
.mjdeck.ready{animation:mjpulse 1.5s ease-in-out infinite}
@keyframes mjpulse{50%{box-shadow:0 4px 0 var(--tileEdge),0 0 18px var(--brass)}}
.mjlive{width:calc(var(--mjw) * 1.22);height:calc(var(--mjh) * 1.22);transform-style:preserve-3d;position:relative;
  transition:transform .5s cubic-bezier(.3,1.2,.4,1)}
.mjlive.empty{opacity:0}
.mjlive .fc{position:absolute;inset:0;border-radius:var(--tr,10px);overflow:hidden;backface-visibility:hidden;
  box-shadow:0 0 0 3px var(--lc,var(--brass)),0 0 14px color-mix(in srgb,var(--lc,#CFA24A) 55%,transparent),0 8px 18px rgba(0,0,0,.6)}
.mjlive .fc.front{background:var(--tileFace)}
.mjlive .fc.rear{background:linear-gradient(158deg,var(--tileA),var(--tileB) 52%,var(--tileC));transform:rotateY(180deg)}
.mjlive svg{width:100%;height:100%;display:block}
.mjlive.spin{transform:rotateY(360deg)}
.mjlive.out{animation:mjout .5s cubic-bezier(.3,1.4,.4,1)}
@keyframes mjout{from{transform:scale(.4) rotateX(80deg);opacity:0}}

.mjfly{position:fixed;z-index:120;transform-style:preserve-3d;pointer-events:none;perspective:900px}
.mjfly{max-width:110px;max-height:160px}
.mjfly .fc{position:absolute;inset:0;border-radius:var(--tr,10px);overflow:hidden;backface-visibility:hidden;
  box-shadow:0 0 0 3px var(--lc,var(--brass)),0 10px 20px rgba(0,0,0,.65)}
.mjfly .fc.front{background:var(--tileFace)}
.mjfly .fc.rear{background:linear-gradient(158deg,var(--tileA),var(--tileB) 52%,var(--tileC));transform:rotateY(180deg)}
.mjfly .fc.rear::after{content:"";position:absolute;inset:15%;border-radius:12%;
  border:1.5px solid rgba(0,0,0,.18);box-shadow:inset 0 0 0 2px rgba(255,255,255,.22)}
.mjfly svg{width:100%;height:100%;display:block}
.mjt.matched{animation:mjmatch .42s forwards}
@keyframes mjmatch{40%{transform:scale(1.14);box-shadow:0 0 0 3px #CFA24A}
  100%{transform:scale(.3) rotateX(70deg);opacity:0}}
.mjt.shift{animation:mjshift .3s}
@keyframes mjshift{from{transform:translateY(28%)}}
.mjlot{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;padding:16px 0;width:100%}
.mjlot .l{min-width:66px;padding:10px 6px;border-radius:12px;background:var(--ink2);
  border:1px solid var(--line);text-align:center}
.mjlot .l .nm{font-size:11.5px;color:var(--muted)}
.mjlot .l .v{font-family:"IBM Plex Mono",monospace;font-size:23px;color:var(--bone)}
.mjlot .l.top{border-color:var(--brass)}
.mjlot .l.top .v{color:var(--brass)}

/* ===== أونلاين ===== */
.netbar{display:flex;align-items:center;gap:7px;margin:8px 0 0;padding:7px 11px;border-radius:12px;
  background:var(--ink2);border:1px solid var(--line);font-size:12px;color:var(--bone2)}
.netbar .dotq{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.netbar.good .dotq{background:var(--ok)} .netbar.ok .dotq{background:var(--brass)}
.netbar.weak .dotq{background:var(--clay);animation:mjdot 1s infinite}
.netbar.offline .dotq{background:#6a6a6a}
.netbar .code{font-family:"IBM Plex Mono",monospace;letter-spacing:.18em;color:var(--brass);font-weight:600}
.netbar .rtt{margin-inline-start:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
.netbar button{background:none;border:1px solid var(--line);color:var(--bone2);border-radius:8px;
  padding:3px 9px;font-family:inherit;font-size:11.5px;cursor:pointer}
.netbar button.mic.on{border-color:var(--ok);color:var(--ok)}
.netbar button.mic.mut{border-color:var(--clay);color:var(--clay)}
.roomcode{font-family:"IBM Plex Mono",monospace;font-size:30px;letter-spacing:.3em;color:var(--brass);
  text-align:center;padding:14px 0 4px;font-weight:600}
.roomhint{text-align:center;color:var(--muted);font-size:12.5px;margin:0 0 6px}
.plist{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.prow{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:12px;
  background:var(--ink3);border:1px solid var(--line)}
.prow .av{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:var(--bone);color:var(--ink);font-family:"Aref Ruqaa",serif;font-size:15px}
.prow .nm{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .tag{font-size:10.5px;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.prow.off{opacity:.45}
.prow .mic{font-size:13px;color:var(--muted)}
.prow .mic.on{color:var(--ok)}
.roomfab{position:fixed;z-index:60;inset-inline-start:14px;bottom:calc(16px + env(safe-area-inset-bottom));
  width:52px;height:52px;border-radius:50%;border:1px solid var(--brass);display:none;
  background:var(--ink2);color:var(--brass);font-size:18px;cursor:pointer;
  box-shadow:0 6px 16px rgba(0,0,0,.55),0 0 0 3px color-mix(in srgb,var(--brass) 22%,transparent);
  align-items:center;justify-content:center}
.roomfab.show{display:flex}
.roomfab .dotq{position:absolute;top:5px;inset-inline-end:5px;width:9px;height:9px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 0 2px var(--ink2);animation:mjdot 1.4s infinite}
.roomfab span{width:26px;height:26px;border-radius:50%;background:var(--bone);color:var(--ink);
  display:grid;place-items:center;font-family:"Aref Ruqaa",serif;font-size:14px;font-weight:700}
.micfab{position:fixed;z-index:60;inset-inline-end:14px;bottom:calc(16px + env(safe-area-inset-bottom));
  width:52px;height:52px;border-radius:50%;border:1px solid var(--line);display:none;
  background:var(--ink2);color:var(--bone2);font-size:21px;cursor:pointer;
  box-shadow:0 6px 16px rgba(0,0,0,.55)}
body.playing .micfab.live{display:grid;place-items:center}
.micfab.on{border-color:var(--ok);color:var(--ok);box-shadow:0 0 0 2px rgba(79,168,138,.35),0 6px 16px rgba(0,0,0,.55)}
.micfab.mut{border-color:var(--clay);color:var(--clay)}
.micfab svg{width:24px;height:24px;display:block}
.netbar .mic svg{width:17px;height:17px;display:block}
.prow .mic svg{width:16px;height:16px;display:block}
.micfab .dotq{position:absolute;top:5px;inset-inline-end:5px;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.micfab.good .dotq{background:var(--ok)} .micfab.ok .dotq{background:var(--brass)}
.micfab.weak .dotq{background:var(--clay)}
.micmenu{position:fixed;z-index:70;display:none;flex-direction:column;gap:2px;padding:6px;
  background:var(--ink2);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 10px 26px rgba(0,0,0,.6)}
.micmenu.on{display:flex}
.micmenu button{display:flex;align-items:center;gap:9px;background:none;border:none;cursor:pointer;
  color:var(--bone2);font-family:inherit;font-size:13.5px;padding:9px 12px;border-radius:10px;white-space:nowrap}
.micmenu button:hover{background:var(--ink3)}
.micmenu button.sel{color:var(--brass)}
.micmenu svg{width:18px;height:18px;flex:none}
.prow .inv{background:var(--brass);border:none;color:var(--ink);border-radius:9px;padding:6px 13px;
  font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.prow .inv[disabled]{background:var(--ink3);color:var(--muted);cursor:default}
.prow .st{font-size:10.5px;color:var(--muted)}
.codein{text-align:center;font-family:"IBM Plex Mono",monospace;letter-spacing:.28em;font-size:20px;text-transform:uppercase}
/* ===== ثيمات ===== */
html[data-theme="night"]{
  --ink:#0A0E18; --ink2:#141A28; --ink3:#1D2536; --line:rgba(214,226,245,.10);
  --felt:#16283F; --felt2:#223C5C;
  --bone:#E7EDF7; --bone2:#CBD6E6; --bone3:#96A5BC;
  --brass:#7FB2E8; --brass2:#3B6C9E;
  --clay:#C25A6E; --indigo:#4C7FD1; --muted:#7C89A0; --ok:#4FB0A8;
  --tileA:#8FC6F2; --tileB:#4E8BC8; --tileC:#31608F; --tileEdge:#21456B; --tileFace:#F2F6FC;
}
html[data-theme="emerald"]{
  --ink:#0A140F; --ink2:#12211A; --ink3:#1A2E24; --line:rgba(226,240,231,.10);
  --felt:#123328; --felt2:#1D5140;
  --bone:#EDF3EA; --bone2:#D2DFCE; --bone3:#A5B6A2;
  --brass:#D8B45C; --brass2:#8B7028;
  --clay:#B2543A; --indigo:#3E7A6B; --muted:#7E8E82; --ok:#4FA88A;
  --tileA:#68C79C; --tileB:#2E8F68; --tileC:#1D6549; --tileEdge:#134734; --tileFace:#F3F8F1;
}
html[data-theme="rose"]{
  --ink:#150C10; --ink2:#22151B; --ink3:#2F1D25; --line:rgba(245,225,232,.10);
  --felt:#3A1A28; --felt2:#54263A;
  --bone:#F6EAEE; --bone2:#E0CBD3; --bone3:#B79EA8;
  --brass:#E0A08C; --brass2:#94564A;
  --clay:#C0455C; --indigo:#7A5A9E; --muted:#98828B; --ok:#59A88F;
  --tileA:#EFA9B8; --tileB:#C9657F; --tileC:#9C4359; --tileEdge:#70293C; --tileFace:#FBF1F4;
}
html[data-theme="sand"]{
  --ink:#161208; --ink2:#241D0F; --ink3:#332917; --line:rgba(247,238,214,.11);
  --felt:#2E4A3C; --felt2:#3F6653;
  --bone:#F8F1DE; --bone2:#E4D8BB; --bone3:#BCAE8C;
  --brass:#E0B341; --brass2:#946F14; --clay:#C0632C; --indigo:#3E6E86;
  --muted:#9A8C6C; --ok:#5AA37F;
  --tileA:#F5D99A; --tileB:#D9A94F; --tileC:#B0812C; --tileEdge:#7E5A15; --tileFace:#FCF6E7;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<script src="./net.js"></script>
<canvas id="fx"></canvas>
<button class="micfab" id="micFab" onclick="micMenu()" aria-label="mic"><i class="dotq"></i><span id="micIco"></span></button>
<button class="roomfab" id="roomFab" onclick="openActiveRoom()" aria-label="active room">
  <i class="dotq good"></i><span id="roomFabAv"></span>
</button>
<div class="micmenu" id="micMenu">
  <button onclick="micSet('on')" id="mm_on"></button>

  $('sxL').textContent=SYM[cfgX.sym][0]; $('soL').textContent=SYM[cfgX.sym][1];
  $('m1L').textContent = cfgM.mode==='solo'?t('you'):t('p1');

/* ================= التخزين المحلي ================= */
const KEY='majlis.v1';
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify({lang,profile,snd:SND.on,cfgX,cfgM,cfg,cfgD,cfgJ})); }catch(e){}
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||'{}');
    if(d.lang) lang=d.lang;
    if(d.profile) profile=d.profile;
    if(d.snd!==undefined) SND.on=d.snd;
    if(d.cfgX) Object.assign(cfgX,d.cfgX);
    if(d.cfgM) Object.assign(cfgM,d.cfgM);
    if(d.cfg) Object.assign(cfg,d.cfg);
    if(d.cfgD) Object.assign(cfgD,d.cfgD);
    if(d.cfgJ) Object.assign(cfgJ,d.cfgJ);
    cfgJ.count=2;
  }catch(e){}
}

/* ================= الصوت ================= */
const SND={on:true,ctx:null};
function AC(){ if(!SND.ctx) SND.ctx=new (window.AudioContext||window.webkitAudioContext)();
  if(SND.ctx.state==='suspended') SND.ctx.resume(); return SND.ctx; }
function tone(f,dur,type='sine',vol=.14,f2=null,delay=0){
  if(!SND.on) return;
  const c=AC(),t0=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t0);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+dur+.05);
}
function noise(dur=.3,vol=.16){
  if(!SND.on) return;
  const c=AC(),b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=c.createBufferSource();s.buffer=b;
  const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=1400;
  const g=c.createGain();g.gain.value=vol;
  s.connect(f);f.connect(g);g.connect(c.destination);s.start();
}
function sfx(k){
  if(!SND.on) return;
  switch(k){
    case 'tap':tone(520,.07,'triangle',.10);break;
    case 'place':tone(440,.10,'triangle',.14);tone(660,.12,'sine',.10,null,.04);break;
    case 'flip':tone(700,.07,'sine',.10,900);break;
    case 'match':tone(660,.12,'triangle',.13);tone(880,.16,'triangle',.12,null,.09);break;
    case 'miss':tone(200,.16,'sawtooth',.08,140);break;
    case 'roll':noise(.32,.18);break;
    case 'step':tone(820,.05,'square',.07);break;
    case 'cap':tone(320,.28,'sawtooth',.16,90);noise(.2,.12);break;
    case 'home':[523,659,784].forEach((f,i)=>tone(f,.16,'triangle',.13,null,i*.07));break;
    case 'win':[523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,'triangle',.15,null,i*.1));break;
    case 'ding':tone(880,.14,'sine',.12);tone(1320,.2,'sine',.09,null,.08);break;
  }
}
function toggleSound(){
  SND.on=!SND.on;
  $('sndBtn').textContent=SND.on?'♪':'✕'; $('sndBtn').classList.toggle('off',!SND.on);
  if(SND.on) sfx('ding'); save();
}
function buzz(m){ try{ if(navigator.vibrate) navigator.vibrate(m); }catch(e){} }
function shake(){ const a=$('app'); a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake'); }

/* ================= مؤثرات ================= */
const cvs=$('fx'),cx=cvs.getContext('2d');
let bits=[],raf=null;
function fit(){ const d=devicePixelRatio||1;
  cvs.width=innerWidth*d;cvs.height=innerHeight*d;cvs.style.width=innerWidth+'px';cvs.style.height=innerHeight+'px';
  cx.setTransform(d,0,0,d,0,0); }
fit(); addEventListener('resize',()=>{fit();ludoPlace();sizeDie();if(mjWall.length)requestAnimationFrame(mjSize);});
function burst(x,y,n=70,cols=[BRASS,BONE,CLAY,INDIGO,'#4FA88A']){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=3+Math.random()*9;
    bits.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,g:.28+Math.random()*.2,c:cols[i%cols.length],
      w:4+Math.random()*6,h:4+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.4,life:70+Math.random()*40});
  }
  if(!raf) raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,cvs.width,cvs.height);
  bits=bits.filter(b=>b.life-->0);
  bits.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.vy+=b.g;b.vx*=.99;b.r+=b.vr;
    cx.save();cx.translate(b.x,b.y);cx.rotate(b.r);cx.globalAlpha=Math.min(1,b.life/30);
    cx.fillStyle=b.c;cx.fillRect(-b.w/2,-b.h/2,b.w,b.h);cx.restore();});
  raf=bits.length?requestAnimationFrame(tick):(cx.clearRect(0,0,cvs.width,cvs.height),null);
}
function burstAt(el,n=60){ if(!el) return; const r=el.getBoundingClientRect();
  burst(r.left+r.width/2,r.top+r.height/2,n); }

let cur='lobby';
function go(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  $(id).classList.add('on'); cur=id; scrollTo(0,0);

const SYM=[['✕','◯'],['★','❖'],['▲','■'],['ض','ق']];
let xoB,xoT,xoLock,xoWin=null,xoS={a:0,b:0,d:0};
const WINS=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function buildSyms(){

function xoNames(){

function xoZero(){

}
function xoNew(auto){

  [1,2].forEach(k=>{const l=document.createElement('div');l.className='ln h';l.style.top=(33.3*k)+'%';bd.appendChild(l);});

}
function xoRail(){
  if(!xoB) return;
  $('sxL').textContent=SYM[cfgX.sym][0]; $('soL').textContent=SYM[cfgX.sym][1];
  const r=$('xorail'), n=xoNames(), sp=r.querySelectorAll('.labels span');

  sp[0].classList.toggle('act',xoT===0); sp[1].classList.toggle('act',xoT===1);
  $('sx').classList.toggle('live',xoT===0); $('so').classList.toggle('live',xoT===1);
}
function xoPlay(i){
  if(xoLock||xoB[i]!==null){ sfx('miss'); return; }
  if(netOn()&&!myTurn('xo')){ sfx('miss'); toast(t('net.notYourTurn')); return; }
  if(netOn()&&!netHost()){
    /* رمز فوري بلا انتظار عودة الشبكة — المضيف يرسل الحالة الحقيقية خلف الكواليس */
    const el=$('xoboard').children[i];
    if(el && !el.innerHTML) el.innerHTML=`<span class="glyph" style="color:${xoT?CLAY:INK}">${SYM[cfgX.sym][xoT]}</span>`;
    sfx('place'); buzz(12);
    N().input('xo',{i}); return;
  }
  if(!netOn()&&cfgX.mode==='solo'&&xoT===1) return;
  xoDo(i);
  if(netOn()&&netHost()) setTimeout(netPush,60);
}
function xoDo(i){
  xoB[i]=xoT; sfx('place'); buzz(12);
  const el=$('xoboard').children[i];
  el.innerHTML=`<span class="glyph" style="color:${xoT?CLAY:INK}">${SYM[cfgX.sym][xoT]}</span>`;
  const w=WINS.find(c=>c.every(k=>xoB[k]===xoT));
  const n=xoNames();
  if(w){
    xoLock=true; xoWin=w; const key=xoT?'b':'a'; xoS[key]++;
    const tile=$(xoT?'so':'sx'); tile.querySelector('b').textContent=xoS[key];
    tile.classList.remove('bump'); void tile.offsetWidth; tile.classList.add('bump');
    xoDrawLine(w);
    $('xores').innerHTML=`<b>${n[xoT]}</b> — ${t('nextRound')}`;
    const ws=xoT;
    setTimeout(()=>winBanner(ws,t('threeRow')),420);
    setTimeout(()=>{ if(cur==='xo'&&xoLock) xoNew(true); },2600);
    return;
  }
  if(xoB.every(v=>v!==null)){
    xoLock=true; sfx('miss'); xoS.d++;
    const tile=$('sd'); tile.querySelector('b').textContent=xoS.d;
    tile.classList.remove('bump'); void tile.offsetWidth; tile.classList.add('bump');
    $('xores').innerHTML=`<b>${t('draw')}</b> — ${t('nextRound')}`;
    setTimeout(()=>{ if(cur==='xo'&&xoLock) xoNew(true); },1900); return;
  }
  xoT=xoT?0:1; xoRail();
  if(!netOn()&&cfgX.mode==='solo'&&xoT===1&&!xoLock) setTimeout(xoBot,480);
}
function xoBot(){
  if(xoLock||cur!=='xo') return;
  const free=xoB.map((v,i)=>v===null?i:-1).filter(i=>i>=0);
  let i;
  if(Math.random()<.15) i=free[Math.floor(Math.random()*free.length)];
  else i=xoBest(xoB.slice(),1).idx;
  xoDo(i);
}
function xoBest(b,p){
  const win=q=>WINS.some(c=>c.every(k=>b[k]===q));
  if(win(0)) return {sc:-10};
  if(win(1)) return {sc:10};
  const free=b.map((v,i)=>v===null?i:-1).filter(i=>i>=0);
  if(!free.length) return {sc:0};
  let best={sc:p===1?-99:99,idx:free[0]};
  for(const i of free){
    b[i]=p;
    const r=xoBest(b,p?0:1); b[i]=null;
    if(p===1?r.sc>best.sc:r.sc<best.sc) best={sc:r.sc,idx:i};
  }
  return best;
}
function xoDrawLine(w,quiet){
  const bd=$('xoboard'),r=bd.getBoundingClientRect();
  const a=bd.children[w[0]].getBoundingClientRect(),b=bd.children[w[2]].getBoundingClientRect();
  const x1=a.left+a.width/2-r.left,y1=a.top+a.height/2-r.top;
  const x2=b.left+b.width/2-r.left,y2=b.top+b.height/2-r.top;
  const len=Math.hypot(x2-x1,y2-y1),ang=Math.atan2(y2-y1,x2-x1)*180/Math.PI;
  const el=document.createElement('div'); el.className='winline';
  el.style.width=len+'px'; el.style.left=x1+'px'; el.style.top=(y1-3)+'px';
  el.style.transform=`rotate(${ang}deg)`; el.style.transformOrigin='0 50%';
  bd.appendChild(el); if(!quiet) burstAt(el,44);
}

/* ================= الذاكرة ================= */
let mDeck,mOpen,mLock,mTurn,mScore,mSeen,mDone;
function openMemSetup(){ if(!hostOnly()) return; sfx('tap');
  document.querySelectorAll('[data-g="memMode"]').forEach(b=>b.classList.toggle('sel',b.dataset.v===cfgM.mode));
  document.querySelectorAll('[data-g="memSize"]').forEach(b=>b.classList.toggle('sel',+b.dataset.v===cfgM.size));
  document.querySelectorAll('[data-g="memLvl"]').forEach(b=>b.classList.toggle('sel',b.dataset.v===cfgM.lvl));
  $('ovMem').classList.add('on');
}
function memZero(){
  mScore=[0,0];
  ['m1','m2'].forEach(id=>$(id).querySelector('b').textContent='0');
}
function memBuild(){
  const bd=$('mboard'); bd.innerHTML='';
  bd.style.gridTemplateColumns=`repeat(${cfgM.size===20?5:4},1fr)`;
  mDeck.forEach((k,i)=>{
    const c=document.createElement('button'); c.className='mcard'; c.dataset.idx=i;
    c.innerHTML=`<div class="mface"><div class="mback">${S.star(BRASS)}</div><div class="mfront">${S[k](INK)}</div></div>`;
    c.onclick=()=>{
      if(netOn()&&!myTurn('mem')){ sfx('miss'); toast(t('net.notYourTurn')); return; }
      if(netOn()&&!netHost()){
        if(!c.classList.contains('flip')){ c.classList.add('flip'); sfx('flip'); buzz(10); }
        N().input('mem',{i}); return;
      }
      if(!netOn()&&cfgM.mode==='solo'&&mTurn===1) return;
      memFlip(i,c);
    };
    bd.appendChild(c);
  });
}
function memNew(auto){
  closeAll(); if(!auto) sfx('tap');
  netTune();
  const pairs=cfgM.size/2, kinds=MEMKINDS.slice(0,pairs);
  mDeck=[...kinds,...kinds].sort(()=>Math.random()-.5);
  mOpen=[]; mLock=false; mTurn=0; mScore=[0,0]; mSeen={}; mDone=0;
  memBuild();
  $('m1').querySelector('b').textContent='0'; $('m2').querySelector('b').textContent='0';
  $('m1L').textContent=memName(0); $('m2L').textContent=memName(1);
  $('mres').textContent=''; memRail(); netPush();
}
function memName(s){
  return seatName(s) || (cfgM.mode==='solo' ? (s?t('cpu'):t('you')) : t(s?'p2':'p1'));
}
function memRail(){
  if(!mDeck) return;
  const r=$('mrail'), sp=r.querySelectorAll('.labels span');
  sp[0].textContent=memName(0); sp[1].textContent=memName(1);
  $('m1L').textContent=memName(0); $('m2L').textContent=memName(1);
  r.classList.toggle('p2',mTurn===1);
  sp[0].classList.toggle('act',mTurn===0); sp[1].classList.toggle('act',mTurn===1);
  $('m1').classList.toggle('live',mTurn===0); $('m2').classList.toggle('live',mTurn===1);
}
function memFlip(i,el){
  if(mLock||el.classList.contains('flip')||el.classList.contains('done')) return;
  if(netOn()&&netHost()){ netFx('memflip',{i}); setTimeout(netPush,420); }
  el.classList.add('flip'); sfx('flip'); buzz(10);
  const keep = cfgM.lvl==='hard'?1:(cfgM.lvl==='mid'?.8:.5);
  if(Math.random()<keep) mSeen[i]=mDeck[i];
  mOpen.push({i,el});
  if(mOpen.length<2) return;
  mLock=true;
  const [a,b]=mOpen;
  if(mDeck[a.i]===mDeck[b.i]){
    setTimeout(()=>{
      a.el.classList.add('done'); b.el.classList.add('done');
      sfx('match'); buzz([15,40,15]); burstAt(a.el,20); burstAt(b.el,20);
      netFx('memdone',{a:[a.i,b.i]});
      delete mSeen[a.i]; delete mSeen[b.i];
      mScore[mTurn]++; mDone++;
      const tile=$(mTurn?'m2':'m1'); tile.querySelector('b').textContent=mScore[mTurn];
      tile.classList.remove('bump'); void tile.offsetWidth; tile.classList.add('bump');
      mOpen=[]; mLock=false;
      if(netOn()&&netHost()) netPush();
      if(mDone===cfgM.size/2) memEnd(); else if(!netOn()&&cfgM.mode==='solo'&&mTurn===1) setTimeout(memBot,600);
    },380);
  } else {
    setTimeout(()=>{
      a.el.classList.add('miss'); b.el.classList.add('miss'); sfx('miss');
      netFx('memclose',{a:[a.i,b.i]});
      setTimeout(()=>{
        a.el.classList.remove('flip','miss'); b.el.classList.remove('flip','miss');
        mOpen=[]; mLock=false; mTurn=mTurn?0:1; memRail(); if(netOn()&&netHost()) netPush();
        if(!netOn()&&cfgM.mode==='solo'&&mTurn===1) setTimeout(memBot,600);
      },300);
    },720);
  }
}
function memBot(){
  if(mDone===cfgM.size/2||cur!=='mem') return;
  const cards=[...document.querySelectorAll('.mcard')].filter(c=>!c.classList.contains('done'));
  const idxs=cards.map(c=>+c.dataset.idx);
  let pair=null;
  const keys=Object.keys(mSeen).filter(i=>idxs.includes(+i));
  for(const a of keys) for(const b of keys)
    if(a!==b && mSeen[a]===mSeen[b]){ pair=[+a,+b]; break; }
  let first,second;
  if(pair){ [first,second]=pair; }
  else{
    const unseen=idxs.filter(i=>mSeen[i]===undefined);
    first = (unseen.length?unseen:idxs)[Math.floor(Math.random()*(unseen.length?unseen.length:idxs.length))];
  }
  const el1=document.querySelector(`.mcard[data-idx="${first}"]`);
  memFlip(first,el1);
  setTimeout(()=>{
    if(second===undefined){
      const rest=idxs.filter(i=>i!==first && !document.querySelector(`.mcard[data-idx="${i}"]`).classList.contains('flip'));
      const known=rest.find(i=>mSeen[i]===mDeck[first]);
      second = known!==undefined?known:rest[Math.floor(Math.random()*rest.length)];
    }
    const el2=document.querySelector(`.mcard[data-idx="${second}"]`);
    if(el2) memFlip(second,el2);
  },700);
}
function memEnd(){
  const tie=mScore[0]===mScore[1];
  const n=[memName(0),memName(1)];
  const w=mScore[0]>mScore[1]?0:1;
  $('mres').innerHTML=(tie?`<b>${t('draw')}</b>`:`<b>${n[w]}</b>`)+' — '+t('nextRound');
  if(!tie) setTimeout(()=>winBanner(w,
    `${Math.max(...mScore)} / ${Math.min(...mScore)} ${t('pairs')}`),400);
  setTimeout(()=>{ if(cur==='mem'&&mDone===cfgM.size/2) memNew(true); },tie?2100:2900);

/* إعادة طلاء اللوح من الحالة (تُستعمل عند المزامنة) */
function dotsPaint(){
  for(let r=0;r<=dbN;r++)for(let c=0;c<dbN;c++){
    const el=$(`h${r}_${c}`); if(!el) continue;
    const v=dbH[r][c];
    el.classList.toggle('on',v>=0); el.style.background = v>=0?DBC[v]:'';
  }
  for(let r=0;r<dbN;r++)for(let c=0;c<=dbN;c++){
    const el=$(`v${r}_${c}`); if(!el) continue;
    const v=dbV[r][c];
    el.classList.toggle('on',v>=0); el.style.background = v>=0?DBC[v]:'';
  }
  for(let r=0;r<dbN;r++)for(let c=0;c<dbN;c++){
    const bx=$(`bx${r}_${c}`); if(!bx) continue;
    const o=dbOwn[r][c];
    bx.classList.toggle('on',o>=0);
    if(o>=0){ bx.style.background=DBC[o]; bx.querySelector('span').textContent=[...dbName(o)][0]; }
    else { bx.style.background=''; bx.querySelector('span').textContent=''; }
  }
}
function dotsNew(auto){
  closeAll(); if(!auto) sfx('tap');
  netTune();
  dbN=cfgD.grid;
  dbH=Array.from({length:dbN+1},()=>Array(dbN).fill(-1));
  dbV=Array.from({length:dbN},()=>Array(dbN+1).fill(-1));
  dbOwn=Array.from({length:dbN},()=>Array(dbN).fill(-1));
  dbScore=Array(cfgD.count).fill(0);
  dbHum=Array.from({length:cfgD.count},(_,i)=>cfgD.mode==='party'||i===0);
  dbCur=0; dbLock=false; dbLeft=dbN*dbN;
  dotsBuild(); dotsPaint();
  $('dbres').textContent=''; dbrail(); netPush();
  if(!dbHum[0]) setTimeout(dbBot,700);
}
function dbSides(r,c){
  return (dbH[r][c]>=0?1:0)+(dbH[r+1][c]>=0?1:0)+(dbV[r][c]>=0?1:0)+(dbV[r][c+1]>=0?1:0);
}
function dbFree(){
  const out=[];
  for(let r=0;r<=dbN;r++)for(let c=0;c<dbN;c++) if(dbH[r][c]<0) out.push(['h',r,c]);
  for(let r=0;r<dbN;r++)for(let c=0;c<=dbN;c++) if(dbV[r][c]<0) out.push(['v',r,c]);
  return out;
}
function dbBoxesOf(k,r,c){
  const b=[];
  if(k==='h'){ if(r>0) b.push([r-1,c]); if(r<dbN) b.push([r,c]); }
  else { if(c>0) b.push([r,c-1]); if(c<dbN) b.push([r,c]); }
  return b;
}
function dbPlay(k,r,c){
  if(dbLock||cur!=='dots') return;
  if(!dbHum[dbCur]) return;
  dbDo(k,r,c);
  if(netOn()&&netHost()) setTimeout(netPush,60);
}
function dbDo(k,r,c){
  const arr = k==='h'?dbH:dbV;
  if(arr[r][c]>=0) { sfx('miss'); return; }
  dbLock=true; arr[r][c]=dbCur; netFx('dbline',{k,r,c,p:dbCur});
  const el=$(`${k}${r}${'_'}${c}`);
  el.classList.add('on','pop'); el.style.background=DBC[dbCur];
  sfx('place'); buzz(10);
  let got=0;
  dbBoxesOf(k,r,c).forEach(([br,bc])=>{
    if(dbOwn[br][bc]<0 && dbSides(br,bc)===4){
      dbOwn[br][bc]=dbCur; dbScore[dbCur]++; dbLeft--; got++;
      const bx=$(`bx${br}_${bc}`);
      bx.style.background=DBC[dbCur]; bx.classList.add('on');
      bx.querySelector('span').textContent=[...dbName(dbCur)][0];
      setTimeout(()=>burstAt(bx,18),60);
    }
  });
  if(got){ sfx('match'); buzz([15,40,15]); }
  dbrail();
  if(dbLeft===0){ setTimeout(dbEnd,500); return; }
  if(got){
    dbLock=false;
    if(dbHum[dbCur]) toast(t('dots.again'));
    else setTimeout(dbBot,520);
    return;
  }
  dbCur=(dbCur+1)%cfgD.count; dbrail(); dbLock=false;
  if(!dbHum[dbCur]) setTimeout(dbBot,560);
}
function dbBot(){
  if(cur!=='dots'||dbLeft===0) return;
  const free=dbFree();
  if(!free.length) return;
  const win=free.filter(([k,r,c])=>dbBoxesOf(k,r,c).some(([br,bc])=>dbOwn[br][bc]<0&&dbSides(br,bc)===3));
  let pick;
  if(win.length) pick=win[Math.floor(Math.random()*win.length)];
  else{
    const safe=free.filter(([k,r,c])=>!dbBoxesOf(k,r,c).some(([br,bc])=>dbSides(br,bc)===2));
    pick=(safe.length?safe:free)[Math.floor(Math.random()*(safe.length||free.length))];
  }
  dbDo(pick[0],pick[1],pick[2]);
}
function dbEnd(){
  const best=Math.max(...dbScore);
  const winners=dbScore.map((s,i)=>s===best?i:-1).filter(i=>i>=0);
  if(winners.length>1){
    $('dbres').innerHTML=`<b>${t('draw')}</b> — ${t('nextRound')}`;
  }else{
    const w=winners[0];
    $('dbres').innerHTML=`<b>${dbName(w)}</b> — ${t('nextRound')}`;
    setTimeout(()=>winBanner(w,`${best} ${t('dots.boxes')}`,[DBC[w],BONE,BRASS]),400);
  }
  setTimeout(()=>{ if(cur==='dots'&&dbLeft===0) dotsNew(true); },winners.length>1?2200:3000);
}

function mjSize(){
  const wrap=$('mjwrap'); if(!wrap||!wrap.parentElement) return;
  const W=wrap.clientWidth, H=wrap.clientHeight;
  if(!W||!H) return;
  const fr=wrap.querySelector('.mjframe');
  const cs=fr?getComputedStyle(fr):null;
  const pad=cs?(parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight)):22;
  const colGap=Math.max(2,Math.round(W*0.012));
  const tileW=Math.floor((W-pad-colGap*(MJCOLS-1)-8)/MJCOLS);
  wrap.style.setProperty('--mjw', tileW+'px');
  wrap.style.setProperty('--tr', Math.max(5,Math.round(tileW*0.17))+'px');
  // الارتفاع: يُملأ رأسياً ثم يُقيَّد بنسبة معقولة
  const rows=cfgJ.depth*2;
  let hi=Math.round(tileW*1.75), lo=Math.max(14,Math.round(tileW*0.8)), best=lo;
  const fits=v=>{
    wrap.style.setProperty('--mjh', v+'px');
    return wrap.scrollHeight<=H && wrap.scrollWidth<=W+1;
  };
  if(fits(hi)) best=hi;
  else{ for(let i=0;i<9;i++){ const mid=Math.round((lo+hi)/2);
      if(fits(mid)){ best=mid; lo=mid; } else hi=mid; } }
  wrap.style.setProperty('--mjh', best+'px');
}

/* ---- السحب ---- */
const mjFull=c=>c.length>0 && c.every(x=>x===c[0]);
function mjShown(col){          // البلاطات المطابقة في المقدمة تكون مكشوفة
  let n=1; while(n<col.length && col[n]===col[0]) n++;
  return n;
}
const mjDone=p=>mjWall[p].every(mjFull);
function mjHasMatch(p){
  return mjWall[p].some(c=>!mjFull(c) && c[0]===mjDrawn);
}
function mjSpin(){
  const lv=$('mjlive');
  lv.classList.remove('spin','out'); void lv.offsetWidth; lv.classList.add('spin');
  setTimeout(()=>lv.classList.remove('spin'),520);
}
function mjNeedCount(kind){
  let n=0;
  for(let p=0;p<cfgJ.count;p++)
    mjWall[p].forEach(c=>{ if(c.length && !mjFull(c) && c[0]===kind) n++; });
  return n;
}
/* اختيار مرجّح: كلما كانت البلاطة مطلوبة في أعمدة أكثر ارتفع حظّها */
function mjPullWeighted(){
  const w=mjPile.map(k=>1+mjNeedCount(k)*5);
  const tot=w.reduce((a,b)=>a+b,0);
  let r=Math.random()*tot, i=0;
  while(i<w.length-1 && r>w[i]){ r-=w[i]; i++; }
  return mjPile.splice(i,1)[0];
}
function mjDraw(){
  if(netOn()&&!myTurn('mj')){ sfx('miss'); toast(t('net.notYourTurn')); return; }
  if(netOn()&&!netHost()){ N().input('mjDraw',{}); return; }
  if(mjDrawn||mjLock||mjOver||cur!=='mj') return;
  if(!mjPile.length){
    if(!mjDisc.length){ mjEndByCount(); return; }
    mjPile=mjDisc.sort(()=>Math.random()-.5); mjDisc=[]; toast(t('mj.reshuffle'));
  }
  if(++mjIdle>70){ mjEndByCount(); return; }
  mjDrawn=mjPullWeighted(); sfx('flip'); buzz(10); netFx('mjdraw',{k:mjDrawn});
  mjRender(); mjSpin();
  mjOffer(mjCur);
}
function mjOffer(p){
  if(mjHasMatch(p)){
    mjCur=p; mjRender();
    if(netOn()&&netHost()) setTimeout(netPush,50);
    $('mjres').textContent = mjHum[p]?t('mj.match'):'';
    if(!mjHum[p]) setTimeout(()=>mjAuto(p),640);
  }else{
    $('mjres').textContent='';
    if(netOn()&&netHost()) setTimeout(netPush,50);
    setTimeout(mjPass,780);
  }
}
function mjPick(ci,who){
  if(netOn()&&!myTurn('mj')){ sfx('miss'); toast(t('net.notYourTurn')); return; }
  if(netOn()&&!netHost()){ N().input('mjPick',{ci,p:(who!==undefined?who:mjCur)}); return; }
  if(mjLock||mjOver||!mjDrawn||!mjHum[mjCur]) return;
  if(who!==undefined && who!==mjCur) return;
  const p=mjCur;
  if(mjFull(mjWall[p][ci])||mjWall[p][ci][0]!==mjDrawn){ sfx('miss'); return; }
  mjPush(p,ci);
}
function mjAuto(p){
  const ci=mjWall[p].findIndex(c=>!mjFull(c)&&c[0]===mjDrawn);
  if(ci>=0) mjPush(p,ci);
}
/* حركة الدفع كما يراها الضيف (بلا تغيير الحالة) */
function mjPushFx(p,ci,kind,popped){
  const isMine=(p===mjView());
  const colEl = isMine ? $(`mc${ci}`) : $(`fc${p}_${ci}`);
  if(!colEl) return;
  const kids=[...colEl.children]; if(!kids.length) return;
  const headEl = kids[0];                    // رأس الصف = أول بلاطة في البيانات
  const lastEl = kids[kids.length-1];
  const hr=rectOf(headEl), lr=rectOf(lastEl);
  const liveRect=rectOf($('mjlive'))||rectOf($('mjdeck'));
  if(!hr||!liveRect) return;
  const step=hr.h+3, away=isMine?1:-1;
  const ghost=makeFly(hr, mjFace(kind), false);
  const s0=clampSc(liveRect.w/hr.w);
  $('mjlive').classList.add('empty');
  if(ghost) ghost.animate([
    {transform:`translate(${liveRect.x-hr.x}px,${liveRect.y-hr.y}px) scale(${s0})`},
    {transform:'translate(0,0) scale(1)'}],{duration:340,easing:'cubic-bezier(.3,1.15,.4,1)',fill:'forwards'});
  sfx('step');
  setTimeout(()=>{
    kids.forEach((k,i)=>{
      const tail=(k===lastEl);
      k.animate([{transform:'translateY(0)',opacity:1},
        {transform:`translateY(${away*step*(tail?1.45:1)}px)`,opacity:tail?.55:1}],
        {duration:340,delay:tail?0:i*12,easing:'cubic-bezier(.34,1.1,.42,1)',fill:'forwards'});
    });
    sfx('match'); buzz([12,30,12]); burstAt(colEl,16);
    setTimeout(()=>{
      if(ghost) ghost.remove();
      /* البلاطة المطرودة تطير إلى المنتصف وتنقلب */
      if(popped && lr){
        const target=rectOf($('mjlive'))||rectOf($('mjdeck'));
        const from={x:lr.x, y:lr.y+away*step*1.45, w:lr.w, h:lr.h};
        const f2=(target)?makeFly(target, mjFace(popped), true):null;
        if(f2){
          const dx=from.x-target.x, dy=from.y-target.y, sc=clampSc(from.w/target.w);
          sfx('flip');
          f2.animate([
            {transform:`rotateY(180deg) translate(${dx}px,${dy}px) scale(${sc})`,offset:0},
            {transform:`rotateY(90deg) translate(${dx*.55}px,${dy*.55}px) scale(${(sc+1)/2*1.15})`,offset:.55},
            {transform:'rotateY(0deg) translate(0,0) scale(1)',offset:1}
          ],{duration:640,easing:'cubic-bezier(.3,.85,.32,1)',fill:'forwards'});
          setTimeout(()=>f2.remove(),660);
        }
      }
    },400);
  },330);
}
/* ---- الدفع: تدخل أمام مثيلتها، ثم تُطرد الأخيرة وتُقلب ---- */
function rectOf(el){
  if(!el) return null;
  const r=el.getBoundingClientRect();
  if(!r.width||!r.height) return null;
  return {x:r.left,y:r.top,w:r.width,h:r.height};
}
const clampSc=v=>(!isFinite(v)||v<=0)?1:Math.max(.3,Math.min(v,1.8));
function makeFly(r,faceHTML,showBack){
  if(!r) return null;
  const f=document.createElement('div'); f.className='mjfly';
  f.style.left=r.x+'px'; f.style.top=r.y+'px'; f.style.width=r.w+'px'; f.style.height=r.h+'px';
  f.innerHTML=`<div class="fc front">${faceHTML}</div><div class="fc rear"></div>`;
  f.style.setProperty('--lc',MJC[mjCur]||BRASS);
  if(showBack) f.style.transform='rotateY(180deg)';
  document.body.appendChild(f); return f;
}
function mjPush(p,ci){
  mjLock=true;
  netFx('mjpush',{p,ci,k:mjDrawn,e:mjWall[p][ci][mjWall[p][ci].length-1]});
  const col=mjWall[p][ci];
  const isMine=(p===mjView());
  const colEl = isMine ? $(`mc${ci}`) : $(`fc${p}_${ci}`);
  const liveEl = $('mjlive');
  const kind=mjDrawn;
  const kids = colEl ? [...colEl.children] : [];
  const rects = kids.map(rectOf);
  const headEl = kids[0];                    // رأس الصف = أول بلاطة في البيانات
  const lastEl = kids[kids.length-1];        // والذيل آخرها
  const hr = rectOf(headEl), lr = rectOf(lastEl);
  const liveRect = rectOf(liveEl) || rectOf($('mjdeck'));
  const gapPx = (rects.length>1 && rects[0] && rects[1])
      ? Math.abs(rects[1].y-rects[0].y)-rects[0].h : 3;
  const stepPx = (hr ? hr.h : 40) + Math.max(2,gapPx);
  const away = isMine ? 1 : -1;      // اتجاه الدفع بعيداً عن الوسط

  if(!hr||!liveRect){                // مسار احتياطي بلا حركة
    col.unshift(kind); const pp=col.pop(); mjDrawn=pp;
    mjCur=p; mjLock=false; mjRender();
    if(mjDone(p)){ mjWin(p); return; }
    mjOffer(p); return;
  }

  /* ١) البلاطة الحيّة تطير إلى فم العمود، وتقف أمام الرأس */
  liveEl.classList.add('empty');
  const ghost=makeFly(hr, mjFace(kind), false);
  const s0=clampSc(liveRect.w/hr.w);
  const preY = -away*stepPx;         // موضع خارج العمود من جهة الوسط
  ghost.animate([
    {transform:`translate(${liveRect.x-hr.x}px,${liveRect.y-hr.y}px) scale(${s0}) rotate(-8deg)`},
    {transform:`translate(0px,${preY}px) scale(1.04) rotate(0deg)`}
  ],{duration:340,easing:'cubic-bezier(.3,1.15,.4,1)',fill:'forwards'});
  sfx('step');

  setTimeout(()=>{
    if(cur!=='mj'){ ghost.remove(); return; }

    /* ٢) الدفع: البلاطة تدخل مكان الرأس، والعمود كله ينزلق للخلف، والذيل يخرج */
    ghost.animate([
      {transform:`translate(0px,${preY}px) scale(1.04)`},
      {transform:'translate(0px,0px) scale(1)'}
    ],{duration:330,easing:'cubic-bezier(.34,1.2,.42,1)',fill:'forwards'});
    kids.forEach((k,i)=>{
      const isTail = (k===lastEl);
      if(isTail){
        k.style.zIndex=99;
        k.animate([{transform:'translateY(0) scale(1)',opacity:1},
                   {transform:`translateY(${away*stepPx*1.45}px) scale(.94)`,opacity:.45}],
          {duration:360,easing:'cubic-bezier(.36,.02,.3,1)',fill:'forwards'});
      }else{
        const d = isMine ? i*14 : (kids.length-1-i)*14;
        k.animate([{transform:'translateY(0)'},{transform:`translateY(${away*stepPx}px)`}],
          {duration:330,delay:d,easing:'cubic-bezier(.34,1.1,.42,1)',fill:'forwards'});
      }
    });
    sfx('match'); buzz([12,30,12]);

    setTimeout(()=>{
      if(cur!=='mj'){ ghost.remove(); return; }
      /* ٣) تحديث الحالة ثم طيران الذيل المكشوف إلى الوسط */
      col.unshift(kind);
      const popped=col.pop();
      mjDrawn=null; mjIdle=0;
      const wasCur=(p===mjCur); mjCur=p;

    const outRect = lr ? {x:lr.x, y:lr.y+away*stepPx*1.45, w:lr.w, h:lr.h} : null;
      ghost.remove();
      mjRender();
      if(colEl) burstAt(colEl,16);
      if(mjFull(col)){ sfx('home'); const ne=isMine?$(`mc${ci}`):$(`fc${p}_${ci}`); if(ne) burstAt(ne,28); }
      if(mjDone(p)){ mjLock=false; mjWin(p); return; }
      if(!wasCur) toast(`${mjName(p)} ${t('mj.took')}`);

      const target=rectOf($('mjlive'))||rectOf($('mjdeck'));
      const from=outRect||target;
      const f2=(from&&target)?makeFly(target, mjFace(popped), true):null;
      if(!f2){ mjDrawn=popped; mjLock=false; mjRender(); netFx('mjdraw',{k:popped,p}); mjOffer(p); return; }
      sfx('flip');
      const dx=from.x-target.x, dy=from.y-target.y, sc=clampSc(from.w/target.w);
      f2.animate([
        {transform:`rotateY(180deg) translate(${dx}px,${dy}px) scale(${sc})`,offset:0},
        {transform:`rotateY(180deg) translate(${dx}px,${dy-away*10}px) scale(${sc*1.06})`,offset:.18},
        {transform:`rotateY(90deg) translate(${dx*.55}px,${dy*.55}px) scale(${(sc+1)/2*1.18})`,offset:.55},
        {transform:`rotateY(-10deg) translate(${dx*.12}px,${dy*.12}px) scale(1.1)`,offset:.84},
        {transform:'rotateY(0deg) translate(0,0) scale(1)',offset:1}
      ],{duration:720,easing:'cubic-bezier(.3,.85,.32,1)',fill:'forwards'});
      setTimeout(()=>{
        f2.remove();
        if(cur!=='mj') return;
        mjDrawn=popped; mjLock=false; mjRender(); netFx('mjdraw',{k:popped,p});
        mjOffer(p);
      },740);
    },370);
  },350);
}
function mjPass(){
  if(cur!=='mj'||mjOver) return;
  const n=cfgJ.count;
  for(let s=1;s<n;s++){
    const q=(mjCur+s)%n;
    if(mjHasMatch(q)){
      mjCur=q; mjRender();
      if(netOn()&&netHost()) netPush();
      if(mjHum[q]){ $('mjres').textContent=t('mj.match'); } else setTimeout(()=>mjAuto(q),620);
      return; }
  }
  toast(t('mj.none')); sfx('miss'); mjDisc.push(mjDrawn); mjDrawn=null;
  mjCur=(mjCur+1)%n; mjRender();
  if(netOn()&&netHost()) netPush();
  if(!mjPile.length && !mjDisc.length){ mjEndByCount(); return; }
  $('mjres').textContent = mjHum[mjCur]?t('mj.draw'):'';
  if(!mjHum[mjCur]) setTimeout(mjBot,700);
}
function mjBot(){
  if(cur!=='mj'||mjOver||mjLock) return;

function mjWin(p){

}

      if(cur!=='ludo'||!LT[f.q]) return;
      const dead=$(`t${f.q}_${f.j}`);
      if(dead){ dead.classList.add('dead'); setTimeout(()=>dead.classList.remove('dead'),420); burstAt(dead,26); }
      LT[f.q][f.j]=-1; ludoPlace(); sfx('cap'); shake(); buzz([30,40,60]);
    }else if(f.type==='mjdraw'){              // بلاطة سُحبت
      if(cur!=='mj') return;
      mjDrawn=f.k; mjRender(); sfx('flip'); buzz(10);
      const lv=$('mjlive'); lv.classList.remove('out'); void lv.offsetWidth; lv.classList.add('out');
    }else if(f.type==='memflip'){
      if(cur!=='mem') return;
      const el=document.querySelector(`.mcard[data-idx="${f.i}"]`);
      if(el&&!el.classList.contains('flip')){ el.classList.add('flip'); sfx('flip'); }
    }else if(f.type==='dbline'){
      if(cur!=='dots') return;
      const el=$(`${f.k}${f.r}_${f.c}`);
      if(el){ el.classList.add('on','pop'); el.style.background=DBC[f.p]; sfx('place'); }
    }
  }catch(e){}
}
function netApply(game,env){
  if(!SNAP[game]||!env) return;
  if(env.F){ if(cur!==game) go(game); netPlayFx(env.F); return; }   // مؤثر فقط
  const st = env.S!==undefined ? env.S : env;
  if(env.L && env.L!==lang){ lang=env.L; applyLang(); }   // توحيد اللغة مع المضيف
  if(env.C) netColors=env.C;
  if(cur!==game) go(game);
  try{ SNAP[game].set(st); }catch(e){ console.error(e); }
  if(env.E && env.E.type==='banner'){
    const e2=env.E; setTimeout(()=>showBannerLocal(e2.a,e2.b,e2.c),260);
  }
  if(env.E && env.E.type==='win'){
    const e2=env.E; setTimeout(()=>showWinLocal(e2.s,e2.b,e2.c),260);
  }
  netSyncControls(); netNudge();
}

/* استطلاع دوري: هل غرفتي المحفوظة لا تزال حيّة وفيها من ينتظر؟ */
async function checkActiveRoom(){
  if(netOn()||pvChecking) return;
  if(!netCfg.code){ setRoomFab(null); return; }
  if(Date.now()-(netCfg.at||0) > 1000*60*60*6){ netCfg.code=''; netSave(); setRoomFab(null); return; }
  pvChecking=true;
  try{
    const base=serverUrl().replace(/^wss:/,'https:').replace(/^ws:/,'http:').replace(/\/(ws)?$/,'');
    const r=await fetch(base+'/peek?code='+encodeURIComponent(netCfg.code),{cache:'no-store'});
    const j=await r.json();
    if(!j.exists){ netCfg.code=''; netSave(); setRoomFab(null); pvPeek=null; return; }
    const waiting=(j.players||[]).filter(p=>p.online && p.name!==profile.name);
    pvPeek=j;
    setRoomFab(waiting.length?waiting[0]:null, j.game);
  }catch(e){ /* تعذّر الاستطلاع — لا تُغيّر شيئاً، حاول لاحقاً */ }
  finally{ pvChecking=false; }
}

    if(N()._leavingSilently) return;      // انضمام عابر لإخطار المغادرة فقط
    if(!netJoinedOnce){ netJoinedOnce=true; closeAllSheets(); }
    netRenderRoom(room); netCfg.code=room.code; netCfg.you=N().you; netSave(); netTune(); prevSave(); lobbyBusy(true);
    if(!netHost() && GAMEOF[room.game] && cur!==room.game) go(room.game);
    if(netHost() && cur!=='lobby') setTimeout(netPush,120);
  };
  M.on.state = ({state,game})=>{ if(N()._leavingSilently) return; if(!netHost()) netApply(game,state); };
  M.on.game  = g=>{ if(N()._leavingSilently) return; if(!netHost()&&GAMEOF[g]) go(g); };
  M.on.input = m=>{ if(netHost()) netHandleInput(m); };
  M.on.quality = netQuality;
  M.on.voice = v=>{
    const p=(N().room?.players||[]).find(x=>x.id===v.id);
    if(p && v.id!==N().you) toast(p.name+' — '+t(v.on?'inv.micOn':'inv.micOff'));
    micPaint();
  };
  M.on.emote = m=>{
    if(m.e==='#end'||m.e==='#out'){
      $('clSub').textContent = (m.name||'')+' — '+t(m.e==='#end'?'cl.host':'cl.guest');
      $('ovClosed').classList.add('on'); sfx('miss'); buzz([30,60,30]);
      setTimeout(checkActiveRoom,1500);
      return;
    }
    toast(`${m.name} ${m.e}`);
  };
  M.on.sys = m=>{
    const map={joined:'net.sysJoined',left:'net.sysLeft',disconnected:'net.sysDrop',
      reconnected:'net.sysBack',host_changed:'net.sysHost',reconnecting:'net.sysRetry',
      closed:'net.sysClosed',mic_denied:'net.micDenied',err_no_room:'net.errNoRoom',
      err_full:'net.errFull'};
    if(m.code==='rejoin_ask'){ askRejoin(m.room); return; }
    const k=map[m.code]; if(!k) return;
    toast((m.name? m.name+' — ':'')+t(k));
    if(m.code==='disconnected'||m.code==='reconnecting') sfx('miss');
    if(m.code==='reconnected'||m.code==='joined') sfx('ding');
  };
  /* الدخول عبر رابط دعوة — عند الفتح وعند تغيّر الرابط */
  const tryHash=()=>{
    const m=location.hash.match(/r=([A-Za-z0-9]{4,6})/);
    if(!m) return;
    const code=m[1].toUpperCase();
    history.replaceState(null,'',location.pathname+location.search);
    if(netOn() && N().room.code===code) return;
    toast(t('net.joining')); netJoin(code);
  };
  addEventListener('hashchange',tryHash);
  setTimeout(tryHash,600);
}
/* المضيف ينفّذ نيّات الضيوف بعد التحقق من صاحب الدور */
function netHandleInput(m){
  const a=m.action, g=m.args||{}, seat=m.seat;
  if(a==='color'){
    const c=+g.c;
    if(netColors.some((x,s)=>s!==seat&&x===c)) return;    // اللون محجوز
    netColors[seat]=c; ludoStart(); return;
  }
  const okSeat = {xo:()=>xoT===seat, mem:()=>mTurn===seat, dots:()=>dbCur===seat,
    ludoRoll:()=>lCur===seat, ludoPick:()=>lCur===seat,
    mjDraw:()=>mjCur===seat, mjPick:()=>mjCur===seat}[a];
  if(okSeat && !okSeat()) return;        // ليس دوره
  netExec=true;
  try{
    if(a==='xo') xoDo(g.i);
    else if(a==='mem'){ const el=document.querySelector(`.mcard[data-idx="${g.i}"]`); if(el) memFlip(g.i,el); }
    else if(a==='dots') dbDo(g.k,g.r,g.c);
    else if(a==='ludoRoll') roll();
    else if(a==='ludoPick') tokClick(g.p,g.i);
    else if(a==='mjDraw') mjDraw();
    else if(a==='mjPick') mjPick(g.ci,g.p);
  }catch(e){ console.error(e); }
  netExec=false;
  /* mjPick و ludoRoll يشغّلان حركات ممتدة (دفع ماهجونج، دوران النرد والاختيار بين الأحجار)
     تدير بثّ حالتها بنفسه في اللحظة المناسبة — بثّ مبكر هنا يقطع الحركة أو يُعيد ضبط النرد قبل أوانه. */
  if(a!=='mjPick' && a!=='ludoRoll') setTimeout(netPush,90);
}
/* ================= تشغيل ================= */
load();
$('pname').textContent=profile.name;
$('av').textContent=[...profile.name][0]; $('av').dataset.st=profile.status;
$('sndBtn').textContent=SND.on?'♪':'✕'; $('sndBtn').classList.toggle('off',!SND.on);
applyTheme();
netInit();
setTimeout(()=>{ try{ lobbyStart(); }catch(e){} },1200);
setTimeout(checkActiveRoom,1800);
setInterval(checkActiveRoom,25000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkActiveRoom(); });
xoNew(); memNew(); dotsNew(true); mjNew(true); ludoStart(); applyLang(); closeAll();
document.addEventListener('click',()=>AC(),{once:true});
if('serviceWorker' in navigator){
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
